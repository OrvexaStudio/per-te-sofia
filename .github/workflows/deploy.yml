
name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Generate site version
        run: |
          echo "{\"version\":\"${GITHUB_SHA}\"}" > site-version.json


      - name: Generate memories gallery
        run: |
          python3 - <<'PY'
          import os
          import json

          folder = "assets/images/ricordi"
          extensions = (".jpg", ".jpeg", ".png", ".webp", ".avif")

          images = []

          if os.path.isdir(folder):
              for root, dirs, files in os.walk(folder):
                  for filename in files:
                      if filename.lower().endswith(extensions):
                          path = os.path.join(root, filename)
                          images.append(path.replace(os.sep, "/"))

          images.sort()

          with open("ricordi.json", "w", encoding="utf-8") as file:
              json.dump(images, file, ensure_ascii=False, indent=2)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
